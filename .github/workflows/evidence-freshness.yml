name: Compatibility evidence freshness

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Reject stale embedded evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Verify committed dependency source
        run: go run -mod=vendor ./tools/vendorcheck -root .
      - name: Verify compatibility evidence is current
        run: go run -mod=vendor ./cmd/leaguebridge manifest verify
      - name: Verify repository-bound readiness evidence
        run: go run -mod=vendor ./tools/readinesscheck -root .
