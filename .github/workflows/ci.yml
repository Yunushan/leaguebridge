        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Download validated release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-dist
          path: dist
      - name: Stage and verify native package input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-package-staging
          go run -mod=vendor ./tools/nativepackagestage \
            -archive "dist/leaguebridge_0.0.0-ci_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" \
            -family "${{ matrix.family }}" \
            -output "native-package-staging/${{ matrix.family }}/${{ matrix.goarch }}"
          go run -mod=vendor ./tools/nativepackagecheck \
            -staging "native-package-staging/${{ matrix.family }}/${{ matrix.goarch }}"
      - name: Build guest version validator for ${{ matrix.goos }}/${{ matrix.goarch }}
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          if [[ -L bsd-ci || ( -e bsd-ci && ! -d bsd-ci ) ]]; then
            echo "bsd-ci must be a real directory" >&2
            exit 1
          fi
          mkdir -p bsd-ci
          go build -mod=vendor -trimpath -buildvcs=true \
            -o "bsd-ci/versioncheck-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./tools/versioncheck
      - name: Boot ${{ matrix.label }} guest
        id: start-vm
        uses: cross-platform-actions/action@faa0c6197e94aacf1c5956460152c8380d3560a5 # v1.5.0
        with:
          operating_system: ${{ matrix.guest_os }}
          architecture: ${{ matrix.cpa_architecture }}
          version: ${{ matrix.guest_version }}
          shell: sh
          memory: 4G
          cpu_count: 2
      - name: Verify cpa.sh helper after VM startup
        id: cpa-ready
        if: steps.start-vm.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cpa.sh >/dev/null 2>&1; then
            echo "cross-platform-actions did not install cpa.sh after VM startup" >&2
            exit 1
          fi
      - name: Build and smoke native package in guest
        if: success() && steps.start-vm.outcome == 'success' && steps.cpa-ready.outcome == 'success'
        shell: cpa.sh {0}
        run: |
          set -eu
          sh scripts/native-package-bsd-smoke.sh \
            v0.0.0-ci "${{ matrix.goos }}" "${{ matrix.family }}" \
            "bsd-ci/versioncheck-${{ matrix.goos }}-${{ matrix.goarch }}"
      - name: Synchronize BSD package evidence to the runner
        if: always() && steps.start-vm.outcome == 'success' && steps.cpa-ready.outcome == 'success'
        run: cpa.sh --sync-files vm-to-runner
      - name: Create signed native BSD package subject
        if: success() && steps.start-vm.outcome == 'success' && steps.cpa-ready.outcome == 'success' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          export CI_ATTESTATION_TREE="$(git rev-parse HEAD^{tree})"
          go run -mod=vendor ./tools/nativepackageattestation \
            -target-goos "${{ matrix.goos }}" -target-goarch "${{ matrix.goarch }}" \
            -family "${{ matrix.family }}" -format pkg \
            -package "native-package-output/${{ matrix.family }}/${{ matrix.goarch }}/${{ matrix.package_file }}" \
            -staging-dir "native-package-staging/${{ matrix.family }}/${{ matrix.goarch }}" \
            -install-evidence "native-package-evidence/${{ matrix.family }}/${{ matrix.goarch }}/install.txt" \
            -output "native-package-evidence/${{ matrix.family }}/${{ matrix.goarch }}/native-package.json" \
            -command 'BSD native package build; package-manager install and uninstall; native install smoke'
      - name: Attest native BSD package subject
        if: success() && github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            native-package-evidence/${{ matrix.family }}/${{ matrix.goarch }}/native-package.json
            native-package-output/${{ matrix.family }}/${{ matrix.goarch }}/${{ matrix.package_file }}
            native-package-staging/${{ matrix.family }}/${{ matrix.goarch }}/NATIVE-PACKAGE-MANIFEST.json
            native-package-staging/${{ matrix.family }}/${{ matrix.goarch }}/root/usr/local/bin/leaguebridge
            native-package-staging/${{ matrix.family }}/${{ matrix.goarch }}/root/usr/local/libexec/leaguebridge/linux-bsd-client-smoke.sh
            native-package-staging/${{ matrix.family }}/${{ matrix.goarch }}/root/usr/local/libexec/leaguebridge/linux-bsd-remote-session.sh
            native-package-staging/${{ matrix.family }}/${{ matrix.goarch }}/root/usr/local/share/doc/leaguebridge/LICENSE
            native-package-staging/${{ matrix.family }}/${{ matrix.goarch }}/root/usr/local/share/doc/leaguebridge/PACKAGE-MANIFEST.json
            native-package-staging/${{ matrix.family }}/${{ matrix.goarch }}/root/usr/local/share/doc/leaguebridge/README.md
            native-package-staging/${{ matrix.family }}/${{ matrix.goarch }}/root/usr/local/share/doc/leaguebridge/SBOM.spdx.json
            native-package-evidence/${{ matrix.family }}/${{ matrix.goarch }}/install.txt
      - name: Retain native BSD package evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-package-bsd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            native-package-output/
            native-package-staging/
            native-package-evidence/
          if-no-files-found: error
          retention-days: 30

  dragonfly-native-package:
    name: Native package (DragonFly BSD 6.4.2)
    if: github.event_name != 'pull_request'
    needs: release-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Download validated release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-dist
          path: dist
      - name: Stage and verify DragonFly native package input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-package-staging
          go run -mod=vendor ./tools/nativepackagestage \
            -archive dist/leaguebridge_0.0.0-ci_dragonfly_amd64.tar.gz \
            -family dports \
            -output native-package-staging/dports/amd64
          go run -mod=vendor ./tools/nativepackagecheck \
            -staging native-package-staging/dports/amd64
      - name: Build DragonFly guest version validator
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: dragonfly
          GOARCH: amd64
        run: |
          set -euo pipefail
          if [[ -L bsd-ci || ( -e bsd-ci && ! -d bsd-ci ) ]]; then
            echo "bsd-ci must be a real directory" >&2
            exit 1
          fi
          mkdir -p bsd-ci
          go build -mod=vendor -trimpath -buildvcs=true \
            -o bsd-ci/versioncheck-dragonfly-amd64 \
            ./tools/versioncheck
      - name: Boot DragonFly BSD 6.4.2 guest
        id: start-dragonfly-vm
        uses: vmactions/dragonflybsd-vm@7cd7c9b7f2b06e8e03d2337a9476995f3c112acf # v1
        with:
          release: "6.4.2"
          mem: 6144
          cpu: 2
          sync: rsync
          custom-shell-name: dragonflybsd
      - name: Verify DragonFly VM shell helper after startup
        id: dragonfly-ready
        if: steps.start-dragonfly-vm.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dragonflybsd >/dev/null 2>&1; then
            echo "vmactions/dragonflybsd-vm did not install the dragonflybsd shell helper" >&2
            exit 1
          fi
      - name: Build and smoke DragonFly native package in guest
        if: success() && steps.start-dragonfly-vm.outcome == 'success' && steps.dragonfly-ready.outcome == 'success'
        shell: dragonflybsd {0}
        run: |
          set -eu
          sh scripts/native-package-bsd-smoke.sh \
            v0.0.0-ci dragonfly dports \
            bsd-ci/versioncheck-dragonfly-amd64
      - name: Verify DragonFly package outputs were copied back
        if: success() && steps.start-dragonfly-vm.outcome == 'success' && steps.dragonfly-ready.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -f native-package-output/dports/amd64/leaguebridge-0.0.0-ci-dragonfly-amd64.pkg
          test -f native-package-evidence/dports/amd64/install.txt
      - name: Create signed DragonFly native package subject
        if: success() && steps.start-dragonfly-vm.outcome == 'success' && steps.dragonfly-ready.outcome == 'success' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          export CI_ATTESTATION_TREE="$(git rev-parse HEAD^{tree})"
          go run -mod=vendor ./tools/nativepackageattestation \
            -target-goos dragonfly -target-goarch amd64 \
            -family dports -format pkg \
            -package native-package-output/dports/amd64/leaguebridge-0.0.0-ci-dragonfly-amd64.pkg \
            -staging-dir native-package-staging/dports/amd64 \
            -install-evidence native-package-evidence/dports/amd64/install.txt \
            -output native-package-evidence/dports/amd64/native-package.json \
            -command 'DragonFly BSD native package build; package-manager install and uninstall; native install smoke'
      - name: Attest DragonFly native package subject
        if: success() && github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            native-package-evidence/dports/amd64/native-package.json
            native-package-output/dports/amd64/leaguebridge-0.0.0-ci-dragonfly-amd64.pkg
            native-package-staging/dports/amd64/NATIVE-PACKAGE-MANIFEST.json
            native-package-staging/dports/amd64/root/usr/local/bin/leaguebridge
            native-package-staging/dports/amd64/root/usr/local/libexec/leaguebridge/linux-bsd-client-smoke.sh
            native-package-staging/dports/amd64/root/usr/local/libexec/leaguebridge/linux-bsd-remote-session.sh
            native-package-staging/dports/amd64/root/usr/local/share/doc/leaguebridge/LICENSE
            native-package-staging/dports/amd64/root/usr/local/share/doc/leaguebridge/PACKAGE-MANIFEST.json
            native-package-staging/dports/amd64/root/usr/local/share/doc/leaguebridge/README.md
            native-package-staging/dports/amd64/root/usr/local/share/doc/leaguebridge/SBOM.spdx.json
            native-package-evidence/dports/amd64/install.txt
      - name: Retain DragonFly native package evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-package-bsd-dragonfly
          path: |
            native-package-output/
            native-package-staging/
            native-package-evidence/
          if-no-files-found: error
          retention-days: 30

  verify-native-package-attestations:
    name: Verify signed native package attestations
    if: github.event_name != 'pull_request'
    needs: [native-package-linux, native-package-bsd, dragonfly-native-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Download Linux native package evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-package-linux
          path: native-package-input/linux
      - name: Download BSD native package evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-package-bsd-*
          path: native-package-input/bsd
          merge-multiple: false
      - name: Arrange exact native package set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-package-output native-package-staging native-package-evidence
          for family in debian rpm; do
            cp -a "native-package-input/linux/native-package-output/$family" native-package-output/
            cp -a "native-package-input/linux/native-package-staging/$family" native-package-staging/
            cp -a "native-package-input/linux/native-package-evidence/$family" native-package-evidence/
          done
          for target in freebsd openbsd netbsd; do
            case "$target" in
              freebsd) family=freebsd-pkg ;;
              openbsd) family=openbsd-pkg ;;
              netbsd) family=pkgsrc ;;
            esac
            for arch in amd64 arm64; do
              source_root="native-package-input/bsd/native-package-bsd-$target-$arch"
              mkdir -p "native-package-output/$family" "native-package-staging/$family" "native-package-evidence/$family"
              cp -a "$source_root/native-package-output/$family/$arch" "native-package-output/$family/"
              cp -a "$source_root/native-package-staging/$family/$arch" "native-package-staging/$family/"
              cp -a "$source_root/native-package-evidence/$family/$arch" "native-package-evidence/$family/"
            done
          done
          source_root=native-package-input/bsd/native-package-bsd-dragonfly
          mkdir -p native-package-output/dports native-package-staging/dports native-package-evidence/dports
          cp -a "$source_root/native-package-output/dports/amd64" native-package-output/dports/
          cp -a "$source_root/native-package-staging/dports/amd64" native-package-staging/dports/
          cp -a "$source_root/native-package-evidence/dports/amd64" native-package-evidence/dports/
      - name: Verify signed native package attestations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          go run -mod=vendor ./tools/nativepackageattestation \
            -verify \
            -expected-repository "$GITHUB_REPOSITORY" \
            -expected-workflow .github/workflows/ci.yml \
            -expected-commit "$actual_commit" \
            -expected-tree "$actual_tree" \
            -expected-ref "$GITHUB_REF" \
            -expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
            -run-id "$EXPECTED_RUN_ID" \
            -run-attempt "$EXPECTED_RUN_ATTEMPT" \
            -verify-subject native-package-evidence/debian/native-package.json \
            -verify-subject native-package-evidence/rpm/native-package.json \
            -verify-subject native-package-evidence/freebsd-pkg/amd64/native-package.json \
            -verify-subject native-package-evidence/freebsd-pkg/arm64/native-package.json \
            -verify-subject native-package-evidence/openbsd-pkg/amd64/native-package.json \
            -verify-subject native-package-evidence/openbsd-pkg/arm64/native-package.json \
            -verify-subject native-package-evidence/pkgsrc/amd64/native-package.json \
            -verify-subject native-package-evidence/pkgsrc/arm64/native-package.json \
            -verify-subject native-package-evidence/dports/amd64/native-package.json
