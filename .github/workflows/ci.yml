name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Verify committed dependency source
        run: go run -mod=vendor ./tools/vendorcheck -root .
      - name: Format check
        shell: bash
        run: |
          mapfile -t go_files < <(git ls-files -- '*.go' ':!vendor/**')
          if [[ "${#go_files[@]}" -eq 0 ]]; then
            exit 0
          fi
          test -z "$(gofmt -l "${go_files[@]}")"
      - name: POSIX shell syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(git ls-files -- 'scripts/*.sh')
          for shell_file in "${shell_files[@]}"; do
            shebang="$(head -n 1 "$shell_file")"
            case "$shebang" in
              '#!/bin/sh'|'#!/usr/bin/env sh')
                sh -n "$shell_file"
                ;;
              '#!/bin/bash'|'#!/usr/bin/env bash')
                bash -n "$shell_file"
                ;;
              *)
                echo "unsupported shell shebang in $shell_file: $shebang" >&2
                exit 1
                ;;
            esac
          done
      - name: Unit tests with race detector
        run: go test -mod=vendor -race ./...
      - name: Vet
        run: go vet -mod=vendor ./...
      - name: Reject stale compatibility evidence
        run: go run -mod=vendor ./cmd/leaguebridge manifest verify
      - name: Verify repository-bound readiness evidence
        run: go run -mod=vendor ./tools/readinesscheck -root .
      - name: Create commit-bound race/vet attestation subject
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          CI_ATTESTATION_TARGET_GOOS: linux
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          actual_tree="$(git rev-parse HEAD^{tree})"
          export CI_ATTESTATION_TREE="$actual_tree"
          if [[ -L ci-attestation || ( -e ci-attestation && ! -d ci-attestation ) ]]; then
            echo "ci-attestation must be a real directory" >&2
            exit 1
          fi
          mkdir -p ci-attestation
          go run -mod=vendor ./tools/ciattestation \
            -kind race-vet \
            -output ci-attestation/race-vet.json \
            -target-goos "$CI_ATTESTATION_TARGET_GOOS" \
            -target-goarch amd64 \
            -command 'go test -mod=vendor -race ./...; go vet -mod=vendor ./...'
      - name: Retain race/vet attestation subject
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-attestation-race-vet-${{ matrix.os }}
          path: ci-attestation/race-vet.json
          if-no-files-found: error
          retention-days: 30

  attest-race-vet:
    name: Attest Linux race/vet subject
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download race/vet subject
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-attestation-race-vet-ubuntu-24.04
          path: ci-attestation-input
      - name: Attest commit-bound race/vet subject
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ci-attestation-input/ci-attestation/race-vet.json

  minimum-go:
    name: Minimum Go compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up minimum Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24.13"
          cache: false
      - name: Test minimum supported builder
        run: go test -mod=vendor ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Enforce coverage floor
        run: go run -mod=vendor ./tools/coverage -minimum 80

  vulnerability-scan:
    name: Reachable vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Reject reachable known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  cross-build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: freebsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64
          - goos: netbsd
            goarch: amd64
          - goos: dragonfly
            goarch: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Cross-build static CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [[ -L ci-build || ( -e ci-build && ! -d ci-build ) ]]; then
            echo "ci-build must be a real directory" >&2
            exit 1
          fi
          mkdir -p ci-build
          go build -mod=vendor -trimpath -buildvcs=true \
            -o "ci-build/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/leaguebridge
      - name: Create commit-bound cross-build attestation subject
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          actual_tree="$(git rev-parse HEAD^{tree})"
          export CI_ATTESTATION_TREE="$actual_tree"
          if [[ -L ci-attestation || ( -e ci-attestation && ! -d ci-attestation ) ]]; then
            echo "ci-attestation must be a real directory" >&2
            exit 1
          fi
          mkdir -p ci-attestation
          go run -mod=vendor ./tools/ciattestation \
            -kind cross-build \
            -output ci-attestation/cross-build.json \
            -target-goos "${{ matrix.goos }}" \
            -target-goarch "${{ matrix.goarch }}" \
            -subject "ci-build/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}" \
            -command 'go build -mod=vendor -trimpath -buildvcs=true ./cmd/leaguebridge'
      - name: Retain cross-build attestation subject
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-attestation-cross-build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ci-attestation/cross-build.json
            ci-build/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 30

  attest-cross-build:
    name: Attest ${{ matrix.goos }}/${{ matrix.goarch }} cross-build subject
    if: github.event_name != 'pull_request'
    needs: cross-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: freebsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64
          - goos: netbsd
            goarch: amd64
          - goos: dragonfly
            goarch: amd64
    steps:
      - name: Download cross-build subject and binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-attestation-cross-build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ci-attestation-input
      - name: Attest commit-bound cross-build subject and binary
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ci-attestation-input/ci-attestation/cross-build.json
            ci-attestation-input/ci-build/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}

  verify-ci-attestations:
    name: Verify signed CI attestations
    if: github.event_name != 'pull_request'
    needs: [attest-race-vet, attest-cross-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Download signed CI subject artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-attestation-*
          path: ci-attestation-input
          merge-multiple: false
      - name: Arrange one-run verification set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-attestation ci-build
          cp ci-attestation-input/ci-attestation-race-vet-ubuntu-24.04/ci-attestation/race-vet.json \
            ci-attestation/race-vet-linux.json
          while read -r goos goarch; do
            artifact="ci-attestation-cross-build-${goos}-${goarch}"
            cp "ci-attestation-input/${artifact}/ci-attestation/cross-build.json" \
              "ci-attestation/cross-build-${goos}-${goarch}.json"
            cp "ci-attestation-input/${artifact}/ci-build/leaguebridge-${goos}-${goarch}" \
              "ci-build/leaguebridge-${goos}-${goarch}"
          done <<'TARGETS'
          linux amd64
          freebsd amd64
          openbsd amd64
          netbsd amd64
          dragonfly amd64
          TARGETS
      - name: Verify signed race/vet attestations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          go run -mod=vendor ./tools/ciattestation \
            -verify \
            -kind race-vet \
            -expected-repository "$GITHUB_REPOSITORY" \
            -expected-workflow .github/workflows/ci.yml \
            -expected-commit "$actual_commit" \
            -expected-tree "$actual_tree" \
            -expected-ref "$GITHUB_REF" \
            -expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
            -run-id "$EXPECTED_RUN_ID" \
            -run-attempt "$EXPECTED_RUN_ATTEMPT" \
            -verify-subject ci-attestation/race-vet-linux.json
      - name: Verify signed cross-build attestations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          go run -mod=vendor ./tools/ciattestation \
            -verify \
            -kind cross-build \
            -expected-repository "$GITHUB_REPOSITORY" \
            -expected-workflow .github/workflows/ci.yml \
            -expected-commit "$actual_commit" \
            -expected-tree "$actual_tree" \
            -expected-ref "$GITHUB_REF" \
            -expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
            -run-id "$EXPECTED_RUN_ID" \
            -run-attempt "$EXPECTED_RUN_ATTEMPT" \
            -verify-subject ci-attestation/cross-build-linux-amd64.json \
            -verify-subject ci-attestation/cross-build-freebsd-amd64.json \
            -verify-subject ci-attestation/cross-build-openbsd-amd64.json \
            -verify-subject ci-attestation/cross-build-netbsd-amd64.json \
            -verify-subject ci-attestation/cross-build-dragonfly-amd64.json

  bsd-runtime:
    name: BSD kernel runtime (${{ matrix.label }})
    needs: release-smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: FreeBSD 15.1
            goos: freebsd
            guest_os: freebsd
            guest_version: "15.1"
            uname: FreeBSD
          - label: OpenBSD 7.9
            goos: openbsd
            guest_os: openbsd
            guest_version: "7.9"
            uname: OpenBSD
          - label: NetBSD 11.0
            goos: netbsd
            guest_os: netbsd
            guest_version: "11.0"
            uname: NetBSD
          - label: DragonFly BSD 6.4.2
            goos: dragonfly
            guest_os: dragonflybsd
            guest_version: "6.4.2"
            uname: DragonFly
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Download validated release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-dist
          path: dist
      - name: Build static CLI for ${{ matrix.goos }}/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: |
          mkdir -p bsd-ci
          go build -mod=vendor -trimpath -buildvcs=true -o "bsd-ci/leaguebridge-${{ matrix.goos }}-amd64" ./cmd/leaguebridge
      - name: Boot ${{ matrix.label }} guest
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963 # v1.4.0
        with:
          operating_system: ${{ matrix.guest_os }}
          architecture: x86-64
          version: ${{ matrix.guest_version }}
          shell: sh
          memory: 4G
          cpu_count: 2
      - name: Execute CLI and capture BSD evidence
        shell: cpa.sh {0}
        run: |
          sh scripts/bsd-runtime-smoke.sh \
            "bsd-ci/leaguebridge-${{ matrix.goos }}-amd64" \
            "${{ matrix.goos }}" \
            "${{ matrix.uname }}" \
            "bsd-evidence/${{ matrix.goos }}"
      - name: Exercise shipped install lifecycle on ${{ matrix.label }}
        if: always()
        shell: cpa.sh {0}
        run: |
          mkdir -p "bsd-evidence/${{ matrix.goos }}"
          sh scripts/verify-install.sh \
            "dist/leaguebridge_0.0.0-ci_${{ matrix.goos }}_amd64.tar.gz" \
            v0.0.0-ci \
            "${{ matrix.goos }}" \
            amd64 \
            >"bsd-evidence/${{ matrix.goos }}/install-lifecycle.txt" 2>&1
      - name: Synchronize BSD evidence to the runner
        if: always()
        run: cpa.sh --sync-files vm-to-runner
      - name: Retain BSD runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bsd-runtime-${{ matrix.goos }}-${{ matrix.guest_version }}
          path: |
            bsd-evidence/${{ matrix.goos }}/
            bsd-ci/leaguebridge-${{ matrix.goos }}-amd64
          if-no-files-found: error
          retention-days: 30

  attest-bsd-runtime:
    name: Attest BSD runtime (${{ matrix.goos }})
    if: github.event_name != 'pull_request'
    needs: bsd-runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: freebsd
            guest_version: "15.1"
          - goos: openbsd
            guest_version: "7.9"
          - goos: netbsd
            guest_version: "11.0"
          - goos: dragonfly
            guest_version: "6.4.2"
    steps:
      - name: Download BSD runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bsd-runtime-${{ matrix.goos }}-${{ matrix.guest_version }}
          path: bsd-runtime-input
      - name: Attest native BSD runtime subject and evidence
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/native-runtime.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/kernel.txt
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/version.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/status.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/readiness.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/manifest-verify.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/doctor.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/result.txt
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/install-lifecycle.txt
            bsd-runtime-input/bsd-ci/leaguebridge-${{ matrix.goos }}-amd64

  release-smoke:
    name: Reproducible release smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Build twice and compare release checksums
        env:
          VERSION: v0.0.0-ci
        run: bash scripts/verify-release-reproducible.sh
      - name: Retain archives for BSD lifecycle tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  linux-runtime:
    name: Hosted Linux runtime
    needs: release-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Download validated release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-dist
          path: dist
      - name: Exercise shipped Linux install lifecycle
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p linux-evidence
          {
            uname -a
            sh scripts/verify-install.sh \
              "dist/leaguebridge_0.0.0-ci_linux_amd64.tar.gz" \
              v0.0.0-ci \
              linux \
              amd64
          } >"linux-evidence/install-lifecycle.txt" 2>&1
      - name: Build and execute the native Linux CLI smoke
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ci-bin linux-evidence
          go build -mod=vendor -trimpath -buildvcs=true -o ci-bin/leaguebridge-linux-amd64 ./cmd/leaguebridge
          sh scripts/linux-runtime-smoke.sh ci-bin/leaguebridge-linux-amd64 linux-evidence
      - name: Retain hosted Linux runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-runtime
          path: |
            linux-evidence/
            ci-bin/leaguebridge-linux-amd64
          if-no-files-found: error
          retention-days: 30

  attest-linux-runtime:
    name: Attest hosted Linux runtime
    if: github.event_name != 'pull_request'
    needs: linux-runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download Linux runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-runtime
          path: linux-runtime-input
      - name: Attest native Linux runtime subject and evidence
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            linux-runtime-input/linux-evidence/native-runtime.json
            linux-runtime-input/linux-evidence/kernel.txt
            linux-runtime-input/linux-evidence/version.json
            linux-runtime-input/linux-evidence/status.json
            linux-runtime-input/linux-evidence/readiness.json
            linux-runtime-input/linux-evidence/manifest-verify.json
            linux-runtime-input/linux-evidence/doctor.json
            linux-runtime-input/linux-evidence/result.txt
            linux-runtime-input/linux-evidence/install-lifecycle.txt
            linux-runtime-input/ci-bin/leaguebridge-linux-amd64

  verify-native-runtime-attestations:
    name: Verify signed native runtime attestations
    if: github.event_name != 'pull_request'
    needs: [attest-linux-runtime, attest-bsd-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Download Linux runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-runtime
          path: native-runtime-input/linux
      - name: Download BSD runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bsd-runtime-*
          path: native-runtime-input/bsd
          merge-multiple: false
      - name: Arrange exact native runtime set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux-evidence ci-bin bsd-evidence bsd-ci
          cp native-runtime-input/linux/linux-evidence/native-runtime.json linux-evidence/native-runtime.json
          cp native-runtime-input/linux/linux-evidence/kernel.txt linux-evidence/kernel.txt
          cp native-runtime-input/linux/linux-evidence/version.json linux-evidence/version.json
          cp native-runtime-input/linux/linux-evidence/status.json linux-evidence/status.json
          cp native-runtime-input/linux/linux-evidence/readiness.json linux-evidence/readiness.json
          cp native-runtime-input/linux/linux-evidence/manifest-verify.json linux-evidence/manifest-verify.json
          cp native-runtime-input/linux/linux-evidence/doctor.json linux-evidence/doctor.json
          cp native-runtime-input/linux/linux-evidence/result.txt linux-evidence/result.txt
          cp native-runtime-input/linux/linux-evidence/install-lifecycle.txt linux-evidence/install-lifecycle.txt
          cp native-runtime-input/linux/ci-bin/leaguebridge-linux-amd64 ci-bin/leaguebridge-linux-amd64
          for target in freebsd openbsd netbsd dragonfly; do
            case "$target" in
              freebsd) version=15.1 ;;
              openbsd) version=7.9 ;;
              netbsd) version=11.0 ;;
              dragonfly) version=6.4.2 ;;
            esac
            source_root="native-runtime-input/bsd/bsd-runtime-${target}-${version}"
            mkdir -p "bsd-evidence/$target"
            cp "$source_root/bsd-evidence/$target/native-runtime.json" "bsd-evidence/$target/native-runtime.json"
            cp "$source_root/bsd-evidence/$target/kernel.txt" "bsd-evidence/$target/kernel.txt"
            cp "$source_root/bsd-evidence/$target/version.json" "bsd-evidence/$target/version.json"
            cp "$source_root/bsd-evidence/$target/status.json" "bsd-evidence/$target/status.json"
            cp "$source_root/bsd-evidence/$target/readiness.json" "bsd-evidence/$target/readiness.json"
            cp "$source_root/bsd-evidence/$target/manifest-verify.json" "bsd-evidence/$target/manifest-verify.json"
            cp "$source_root/bsd-evidence/$target/doctor.json" "bsd-evidence/$target/doctor.json"
            cp "$source_root/bsd-evidence/$target/result.txt" "bsd-evidence/$target/result.txt"
            cp "$source_root/bsd-evidence/$target/install-lifecycle.txt" "bsd-evidence/$target/install-lifecycle.txt"
            cp "$source_root/bsd-ci/leaguebridge-${target}-amd64" "bsd-ci/leaguebridge-${target}-amd64"
          done
      - name: Verify signed native runtime attestations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          common_args=(
            -expected-repository "$GITHUB_REPOSITORY"
            -expected-workflow .github/workflows/ci.yml
            -expected-commit "$actual_commit"
            -expected-tree "$actual_tree"
            -expected-ref "$GITHUB_REF"
            -expected-workflow-sha "$EXPECTED_WORKFLOW_SHA"
            -run-id "$EXPECTED_RUN_ID"
            -run-attempt "$EXPECTED_RUN_ATTEMPT"
          )
          go run -mod=vendor ./tools/nativeattestation \
            -verify -kind linux-runtime -expected-host-class hosted "${common_args[@]}" \
            -verify-subject linux-evidence/native-runtime.json
          go run -mod=vendor ./tools/nativeattestation \
            -verify -kind bsd-runtime -expected-host-class virtualized "${common_args[@]}" \
            -verify-subject bsd-evidence/freebsd/native-runtime.json \
            -verify-subject bsd-evidence/openbsd/native-runtime.json \
            -verify-subject bsd-evidence/netbsd/native-runtime.json \
            -verify-subject bsd-evidence/dragonfly/native-runtime.json
  native-package-linux:
    name: Native packages (Linux)
    if: github.event_name != 'pull_request'
    needs: release-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Install the pinned runner package toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rpm
      - name: Download validated release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-dist
          path: dist
      - name: Build and smoke native Linux packages
        run: bash scripts/native-package-linux-smoke.sh \
          v0.0.0-ci dist/leaguebridge_0.0.0-ci_linux_amd64.tar.gz
      - name: Create signed native Linux package subjects
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          export CI_ATTESTATION_TREE="$(git rev-parse HEAD^{tree})"
          go run -mod=vendor ./tools/nativepackageattestation \
            -target-goos linux -target-goarch amd64 -family debian -format deb \
            -package native-package-output/debian/leaguebridge_0.0.0~ci_amd64.deb \
            -staging-dir native-package-staging/debian \
            -install-evidence native-package-evidence/debian/install.txt \
            -output native-package-evidence/debian/native-package.json \
            -command 'dpkg native package build; package-manager install and uninstall; native install smoke'
          go run -mod=vendor ./tools/nativepackageattestation \
            -target-goos linux -target-goarch amd64 -family rpm -format rpm \
            -package native-package-output/rpm/leaguebridge-0.0.0-1.ci.x86_64.rpm \
            -staging-dir native-package-staging/rpm \
            -install-evidence native-package-evidence/rpm/install.txt \
            -output native-package-evidence/rpm/native-package.json \
            -command 'rpm native package build; package-manager install and uninstall; native install smoke'
      - name: Attest native Linux package subjects
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            native-package-evidence/debian/native-package.json
            native-package-output/debian/leaguebridge_0.0.0~ci_amd64.deb
            native-package-staging/debian/NATIVE-PACKAGE-MANIFEST.json
            native-package-staging/debian/root/usr/bin/leaguebridge
            native-package-staging/debian/root/usr/share/doc/leaguebridge/LICENSE
            native-package-staging/debian/root/usr/share/doc/leaguebridge/PACKAGE-MANIFEST.json
            native-package-staging/debian/root/usr/share/doc/leaguebridge/README.md
            native-package-staging/debian/root/usr/share/doc/leaguebridge/SBOM.spdx.json
            native-package-evidence/debian/install.txt
            native-package-evidence/rpm/native-package.json
            native-package-output/rpm/leaguebridge-0.0.0-1.ci.x86_64.rpm
            native-package-staging/rpm/NATIVE-PACKAGE-MANIFEST.json
            native-package-staging/rpm/root/usr/bin/leaguebridge
            native-package-staging/rpm/root/usr/share/doc/leaguebridge/LICENSE
            native-package-staging/rpm/root/usr/share/doc/leaguebridge/PACKAGE-MANIFEST.json
            native-package-staging/rpm/root/usr/share/doc/leaguebridge/README.md
            native-package-staging/rpm/root/usr/share/doc/leaguebridge/SBOM.spdx.json
            native-package-evidence/rpm/install.txt
      - name: Retain native Linux package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-package-linux
          path: |
            native-package-output/
            native-package-staging/
            native-package-evidence/
          if-no-files-found: error
          retention-days: 30

  native-package-bsd:
    name: Native package (${{ matrix.label }})
    if: github.event_name != 'pull_request'
    needs: release-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: FreeBSD 15.1
            goos: freebsd
            family: freebsd-pkg
            guest_os: freebsd
            guest_version: "15.1"
            package_file: leaguebridge-0.0.0-ci-freebsd.pkg
          - label: OpenBSD 7.9
            goos: openbsd
            family: openbsd-pkg
            guest_os: openbsd
            guest_version: "7.9"
            package_file: leaguebridge-0.0.0-ci-openbsd.tgz
          - label: NetBSD 11.0
            goos: netbsd
            family: pkgsrc
            guest_os: netbsd
            guest_version: "11.0"
            package_file: leaguebridge-0.0.0-ci-netbsd.tgz
          - label: DragonFly BSD 6.4.2
            goos: dragonfly
            family: dports
            guest_os: dragonflybsd
            guest_version: "6.4.2"
            package_file: leaguebridge-0.0.0-ci-dragonfly.pkg
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Download validated release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-dist
          path: dist
      - name: Stage and verify native package input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-package-staging
          go run -mod=vendor ./tools/nativepackagestage \
            -archive "dist/leaguebridge_0.0.0-ci_${{ matrix.goos }}_amd64.tar.gz" \
            -family "${{ matrix.family }}" \
            -output "native-package-staging/${{ matrix.family }}"
          go run -mod=vendor ./tools/nativepackagecheck \
            -staging "native-package-staging/${{ matrix.family }}"
      - name: Build guest version validator for ${{ matrix.goos }}/amd64
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: |
          set -euo pipefail
          if [[ -L bsd-ci || ( -e bsd-ci && ! -d bsd-ci ) ]]; then
            echo "bsd-ci must be a real directory" >&2
            exit 1
          fi
          mkdir -p bsd-ci
          go build -mod=vendor -trimpath -buildvcs=true \
            -o "bsd-ci/versioncheck-${{ matrix.goos }}-amd64" \
            ./tools/versioncheck
      - name: Boot ${{ matrix.label }} guest
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963 # v1.4.0
        with:
          operating_system: ${{ matrix.guest_os }}
          architecture: x86-64
          version: ${{ matrix.guest_version }}
          shell: sh
          memory: 4G
          cpu_count: 2
      - name: Build and smoke native package in guest
        shell: cpa.sh {0}
        run: sh scripts/native-package-bsd-smoke.sh \
          v0.0.0-ci "${{ matrix.goos }}" "${{ matrix.family }}" \
          "bsd-ci/versioncheck-${{ matrix.goos }}-amd64"
      - name: Synchronize BSD package evidence to the runner
        if: always()
        run: cpa.sh --sync-files vm-to-runner
      - name: Create signed native BSD package subject
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          export CI_ATTESTATION_TREE="$(git rev-parse HEAD^{tree})"
          go run -mod=vendor ./tools/nativepackageattestation \
            -target-goos "${{ matrix.goos }}" -target-goarch amd64 \
            -family "${{ matrix.family }}" -format pkg \
            -package "native-package-output/${{ matrix.family }}/${{ matrix.package_file }}" \
            -staging-dir "native-package-staging/${{ matrix.family }}" \
            -install-evidence "native-package-evidence/${{ matrix.family }}/install.txt" \
            -output "native-package-evidence/${{ matrix.family }}/native-package.json" \
            -command 'BSD native package build; package-manager install and uninstall; native install smoke'
      - name: Attest native BSD package subject
        if: success() && github.event_name != 'pull_request'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            native-package-evidence/${{ matrix.family }}/native-package.json
            native-package-output/${{ matrix.family }}/${{ matrix.package_file }}
            native-package-staging/${{ matrix.family }}/NATIVE-PACKAGE-MANIFEST.json
            native-package-staging/${{ matrix.family }}/root/usr/local/bin/leaguebridge
            native-package-staging/${{ matrix.family }}/root/usr/local/share/doc/leaguebridge/LICENSE
            native-package-staging/${{ matrix.family }}/root/usr/local/share/doc/leaguebridge/PACKAGE-MANIFEST.json
            native-package-staging/${{ matrix.family }}/root/usr/local/share/doc/leaguebridge/README.md
            native-package-staging/${{ matrix.family }}/root/usr/local/share/doc/leaguebridge/SBOM.spdx.json
            native-package-evidence/${{ matrix.family }}/install.txt
      - name: Retain native BSD package evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-package-bsd-${{ matrix.goos }}
          path: |
            native-package-output/
            native-package-staging/
            native-package-evidence/
          if-no-files-found: error
          retention-days: 30

  verify-native-package-attestations:
    name: Verify signed native package attestations
    if: github.event_name != 'pull_request'
    needs: [native-package-linux, native-package-bsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.0"
          cache: false
      - name: Download Linux native package evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-package-linux
          path: native-package-input/linux
      - name: Download BSD native package evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-package-bsd-*
          path: native-package-input/bsd
          merge-multiple: false
      - name: Arrange exact native package set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-package-output native-package-staging native-package-evidence
          for family in debian rpm; do
            cp -a "native-package-input/linux/native-package-output/$family" native-package-output/
            cp -a "native-package-input/linux/native-package-staging/$family" native-package-staging/
            cp -a "native-package-input/linux/native-package-evidence/$family" native-package-evidence/
          done
          for target in freebsd openbsd netbsd dragonfly; do
            case "$target" in
              freebsd) family=freebsd-pkg ;;
              openbsd) family=openbsd-pkg ;;
              netbsd) family=pkgsrc ;;
              dragonfly) family=dports ;;
            esac
            source_root="native-package-input/bsd/native-package-bsd-$target"
            cp -a "$source_root/native-package-output/$family" native-package-output/
            cp -a "$source_root/native-package-staging/$family" native-package-staging/
            cp -a "$source_root/native-package-evidence/$family" native-package-evidence/
          done
      - name: Verify signed native package attestations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          go run -mod=vendor ./tools/nativepackageattestation \
            -verify \
            -expected-repository "$GITHUB_REPOSITORY" \
            -expected-workflow .github/workflows/ci.yml \
            -expected-commit "$actual_commit" \
            -expected-tree "$actual_tree" \
            -expected-ref "$GITHUB_REF" \
            -expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
            -run-id "$EXPECTED_RUN_ID" \
            -run-attempt "$EXPECTED_RUN_ATTEMPT" \
            -verify-subject native-package-evidence/debian/native-package.json \
            -verify-subject native-package-evidence/rpm/native-package.json \
            -verify-subject native-package-evidence/freebsd-pkg/native-package.json \
            -verify-subject native-package-evidence/openbsd-pkg/native-package.json \
            -verify-subject native-package-evidence/pkgsrc/native-package.json \
            -verify-subject native-package-evidence/dports/native-package.json
