name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Verify committed dependency source
        run: go run -mod=vendor ./tools/vendorcheck -root .
      - name: Format check
        shell: bash
        run: |
          mapfile -t go_files < <(git ls-files -- '*.go' ':!vendor/**')
          if [[ "${#go_files[@]}" -eq 0 ]]; then
            exit 0
          fi
          test -z "$(gofmt -l "${go_files[@]}")"
      - name: POSIX shell syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t shell_files < <(git ls-files -- 'scripts/*.sh')
          for shell_file in "${shell_files[@]}"; do
            shebang="$(head -n 1 "$shell_file")"
            case "$shebang" in
              '#!/bin/sh'|'#!/usr/bin/env sh')
                sh -n "$shell_file"
                ;;
              '#!/bin/bash'|'#!/usr/bin/env bash')
                bash -n "$shell_file"
                ;;
              *)
                echo "unsupported shell shebang in $shell_file: $shebang" >&2
                exit 1
                ;;
            esac
          done
      - name: Unit tests with race detector
        run: go test -mod=vendor -race ./...
      - name: Vet
        run: go vet -mod=vendor ./...
      - name: Reject stale compatibility evidence
        run: go run -mod=vendor ./cmd/leaguebridge manifest verify
      - name: Verify repository-bound readiness evidence
        run: go run -mod=vendor ./tools/readinesscheck -root .
      - name: Create commit-bound race/vet attestation subject
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          CI_ATTESTATION_TARGET_GOOS: linux
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          actual_tree="$(git rev-parse HEAD^{tree})"
          export CI_ATTESTATION_TREE="$actual_tree"
          if [[ -L ci-attestation || ( -e ci-attestation && ! -d ci-attestation ) ]]; then
            echo "ci-attestation must be a real directory" >&2
            exit 1
          fi
          mkdir -p ci-attestation
          go run -mod=vendor ./tools/ciattestation \
            -kind race-vet \
            -output ci-attestation/race-vet.json \
            -target-goos "$CI_ATTESTATION_TARGET_GOOS" \
            -target-goarch amd64 \
            -command 'go test -mod=vendor -race ./...; go vet -mod=vendor ./...'
      - name: Retain race/vet attestation subject
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-attestation-race-vet-${{ matrix.os }}
          path: ci-attestation/race-vet.json
          if-no-files-found: error
          retention-days: 30

  attest-race-vet:
    name: Attest Linux race/vet subject
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download race/vet subject
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-attestation-race-vet-ubuntu-24.04
          path: ci-attestation-input
      - name: Attest commit-bound race/vet subject
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ci-attestation-input/race-vet.json

  minimum-go:
    name: Minimum Go compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up minimum Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.12"
          cache: false
      - name: Test minimum supported builder
        run: go test -mod=vendor ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Enforce coverage floor
        run: go run -mod=vendor ./tools/coverage -minimum 80

  vulnerability-scan:
    name: Reachable vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Reject reachable known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  cross-build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: openbsd
            goarch: amd64
          - goos: openbsd
            goarch: arm64
          - goos: netbsd
            goarch: amd64
          - goos: netbsd
            goarch: arm64
          - goos: dragonfly
            goarch: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Cross-build static CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [[ -L ci-build || ( -e ci-build && ! -d ci-build ) ]]; then
            echo "ci-build must be a real directory" >&2
            exit 1
          fi
          mkdir -p ci-build
          go build -mod=vendor -trimpath -buildvcs=true \
            -o "ci-build/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/leaguebridge
      - name: Create commit-bound cross-build attestation subject
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          actual_tree="$(git rev-parse HEAD^{tree})"
          export CI_ATTESTATION_TREE="$actual_tree"
          if [[ -L ci-attestation || ( -e ci-attestation && ! -d ci-attestation ) ]]; then
            echo "ci-attestation must be a real directory" >&2
            exit 1
          fi
          mkdir -p ci-attestation
          go run -mod=vendor ./tools/ciattestation \
            -kind cross-build \
            -output ci-attestation/cross-build.json \
            -target-goos "${{ matrix.goos }}" \
            -target-goarch "${{ matrix.goarch }}" \
            -subject "ci-build/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}" \
            -command 'go build -mod=vendor -trimpath -buildvcs=true ./cmd/leaguebridge'
      - name: Retain cross-build attestation subject
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-attestation-cross-build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ci-attestation/cross-build.json
            ci-build/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 30

  attest-cross-build:
    name: Attest ${{ matrix.goos }}/${{ matrix.goarch }} cross-build subject
    if: github.event_name != 'pull_request'
    needs: cross-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: openbsd
            goarch: amd64
          - goos: openbsd
            goarch: arm64
          - goos: netbsd
            goarch: amd64
          - goos: netbsd
            goarch: arm64
          - goos: dragonfly
            goarch: amd64
    steps:
      - name: Download cross-build subject and binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-attestation-cross-build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ci-attestation-input
      - name: Attest commit-bound cross-build subject and binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ci-attestation-input/ci-attestation/cross-build.json
            ci-attestation-input/ci-build/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}

  verify-ci-attestations:
    name: Verify signed CI attestations
    if: github.event_name != 'pull_request'
    needs: [attest-race-vet, attest-cross-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Download signed CI subject artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-attestation-*
          path: ci-attestation-input
          merge-multiple: false
      - name: Arrange one-run verification set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-attestation ci-build
          cp ci-attestation-input/ci-attestation-race-vet-ubuntu-24.04/race-vet.json \
            ci-attestation/race-vet-linux.json
          while read -r goos goarch; do
            artifact="ci-attestation-cross-build-${goos}-${goarch}"
            cp "ci-attestation-input/${artifact}/ci-attestation/cross-build.json" \
              "ci-attestation/cross-build-${goos}-${goarch}.json"
            cp "ci-attestation-input/${artifact}/ci-build/leaguebridge-${goos}-${goarch}" \
              "ci-build/leaguebridge-${goos}-${goarch}"
          done <<'TARGETS'
          linux amd64
          linux arm64
          freebsd amd64
          freebsd arm64
          openbsd amd64
          openbsd arm64
          netbsd amd64
          netbsd arm64
          dragonfly amd64
          TARGETS
      - name: Verify signed race/vet attestations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          go run -mod=vendor ./tools/ciattestation \
            -verify \
            -kind race-vet \
            -expected-repository "$GITHUB_REPOSITORY" \
            -expected-workflow .github/workflows/ci.yml \
            -expected-commit "$actual_commit" \
            -expected-tree "$actual_tree" \
            -expected-ref "$GITHUB_REF" \
            -expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
            -run-id "$EXPECTED_RUN_ID" \
            -run-attempt "$EXPECTED_RUN_ATTEMPT" \
            -verify-subject ci-attestation/race-vet-linux.json
      - name: Verify signed cross-build attestations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          go run -mod=vendor ./tools/ciattestation \
            -verify \
            -kind cross-build \
            -expected-repository "$GITHUB_REPOSITORY" \
            -expected-workflow .github/workflows/ci.yml \
            -expected-commit "$actual_commit" \
            -expected-tree "$actual_tree" \
            -expected-ref "$GITHUB_REF" \
            -expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
            -run-id "$EXPECTED_RUN_ID" \
            -run-attempt "$EXPECTED_RUN_ATTEMPT" \
            -verify-subject ci-attestation/cross-build-linux-amd64.json \
            -verify-subject ci-attestation/cross-build-linux-arm64.json \
            -verify-subject ci-attestation/cross-build-freebsd-amd64.json \
            -verify-subject ci-attestation/cross-build-freebsd-arm64.json \
            -verify-subject ci-attestation/cross-build-openbsd-amd64.json \
            -verify-subject ci-attestation/cross-build-openbsd-arm64.json \
            -verify-subject ci-attestation/cross-build-netbsd-amd64.json \
            -verify-subject ci-attestation/cross-build-netbsd-arm64.json \
            -verify-subject ci-attestation/cross-build-dragonfly-amd64.json

  bsd-runtime:
    name: BSD kernel runtime (${{ matrix.label }})
    needs: release-smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: FreeBSD 15.1 amd64
            goos: freebsd
            guest_os: freebsd
            guest_version: "15.1"
            uname: FreeBSD
            goarch: amd64
            cpa_architecture: x86-64
          - label: FreeBSD 15.1 arm64
            goos: freebsd
            guest_os: freebsd
            guest_version: "15.1"
            uname: FreeBSD
            goarch: arm64
            cpa_architecture: arm64
          - label: OpenBSD 7.9 amd64
            goos: openbsd
            guest_os: openbsd
            guest_version: "7.9"
            uname: OpenBSD
            goarch: amd64
            cpa_architecture: x86-64
          - label: OpenBSD 7.9 arm64
            goos: openbsd
            guest_os: openbsd
            guest_version: "7.9"
            uname: OpenBSD
            goarch: arm64
            cpa_architecture: arm64
          - label: NetBSD 11.0 amd64
            goos: netbsd
            guest_os: netbsd
            guest_version: "11.0"
            uname: NetBSD
            goarch: amd64
            cpa_architecture: x86-64
          - label: NetBSD 11.0 arm64
            goos: netbsd
            guest_os: netbsd
            guest_version: "11.0"
            uname: NetBSD
            goarch: arm64
            cpa_architecture: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Download validated release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-dist
          path: dist
      - name: Resolve verified repository-evidence marker
        id: repository-evidence
        shell: bash
        run: |
          set -euo pipefail
          go run -mod=vendor ./tools/readinesscheck -root .
          scorecard_sha256="$(sha256sum readiness/scorecard.json | awk '{print $1}')"
          if [[ ! "$scorecard_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "readiness scorecard did not produce a canonical SHA-256 digest" >&2
            exit 1
          fi
          printf 'value=leaguebridge-repository-evidence-v1:%s\n' "$scorecard_sha256" >> "$GITHUB_OUTPUT"
      - name: Build static CLI for ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REPOSITORY_EVIDENCE_VERIFICATION: ${{ steps.repository-evidence.outputs.value }}
        run: |
          mkdir -p bsd-ci
          go build -mod=vendor -trimpath -buildvcs=true \
            -ldflags "-X github.com/Yunushan/leaguebridge/internal/version.RepositoryEvidenceVerification=$REPOSITORY_EVIDENCE_VERIFICATION" \
            -o "bsd-ci/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/leaguebridge
      - name: Boot ${{ matrix.label }} guest
        id: start-vm
        uses: cross-platform-actions/action@faa0c6197e94aacf1c5956460152c8380d3560a5 # v1.5.0
        with:
          operating_system: ${{ matrix.guest_os }}
          architecture: ${{ matrix.cpa_architecture }}
          version: ${{ matrix.guest_version }}
          shell: sh
          memory: 4G
          cpu_count: 2
      - name: Verify cpa.sh helper after VM startup
        id: cpa-ready
        if: steps.start-vm.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cpa.sh >/dev/null 2>&1; then
            echo "cross-platform-actions did not install cpa.sh after VM startup" >&2
            exit 1
          fi
      - name: Execute CLI and capture BSD evidence
        if: success() && steps.start-vm.outcome == 'success' && steps.cpa-ready.outcome == 'success'
        shell: cpa.sh {0}
        run: |
          sh scripts/bsd-runtime-smoke.sh \
            "bsd-ci/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}" \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}" \
            "${{ matrix.uname }}" \
            "bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}"
      - name: Exercise shipped install lifecycle on ${{ matrix.label }}
        if: always() && steps.start-vm.outcome == 'success' && steps.cpa-ready.outcome == 'success'
        shell: cpa.sh {0}
        run: |
          mkdir -p "bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}"
          evidence_file="bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}/install-lifecycle.txt"
          if ! sh scripts/verify-install.sh \
            "dist/leaguebridge_0.0.0-ci_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" \
            v0.0.0-ci \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}" \
            >"$evidence_file" 2>&1; then
            cat "$evidence_file" >&2
            exit 1
          fi
      - name: Synchronize BSD evidence to the runner
        if: always() && steps.start-vm.outcome == 'success' && steps.cpa-ready.outcome == 'success'
        run: cpa.sh --sync-files vm-to-runner
      - name: Create score-free BSD runtime attestation subject
        if: success() && steps.start-vm.outcome == 'success' && steps.cpa-ready.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          export CI_ATTESTATION_TREE="$(git rev-parse HEAD^{tree})"
          go run -mod=vendor ./tools/nativeattestation \
            -kind bsd-runtime \
            -evidence-dir "bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}" \
            -output "bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}/native-runtime.json" \
            -target-goos "${{ matrix.goos }}" \
            -target-goarch "${{ matrix.goarch }}" \
            -host-class virtualized \
            -subject "bsd-ci/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}" \
            -command 'BSD kernel runtime smoke; shipped archive install lifecycle'
      - name: Retain BSD runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bsd-runtime-${{ matrix.goos }}-${{ matrix.guest_version }}-${{ matrix.goarch }}
          path: |
            bsd-evidence/${{ matrix.goos }}/
            bsd-ci/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 30

  dragonfly-runtime:
    name: BSD kernel runtime (DragonFly BSD 6.4.2 amd64)
    needs: release-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Download validated release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-dist
          path: dist
      - name: Resolve verified repository-evidence marker
        id: repository-evidence
        shell: bash
        run: |
          set -euo pipefail
          go run -mod=vendor ./tools/readinesscheck -root .
          scorecard_sha256="$(sha256sum readiness/scorecard.json | awk '{print $1}')"
          if [[ ! "$scorecard_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "readiness scorecard did not produce a canonical SHA-256 digest" >&2
            exit 1
          fi
          printf 'value=leaguebridge-repository-evidence-v1:%s\n' "$scorecard_sha256" >> "$GITHUB_OUTPUT"
      - name: Build static CLI for dragonfly/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: dragonfly
          GOARCH: amd64
          REPOSITORY_EVIDENCE_VERIFICATION: ${{ steps.repository-evidence.outputs.value }}
        run: |
          mkdir -p bsd-ci
          go build -mod=vendor -trimpath -buildvcs=true \
            -ldflags "-X github.com/Yunushan/leaguebridge/internal/version.RepositoryEvidenceVerification=$REPOSITORY_EVIDENCE_VERIFICATION" \
            -o bsd-ci/leaguebridge-dragonfly-amd64 ./cmd/leaguebridge
      - name: Boot DragonFly BSD 6.4.2 guest
        id: start-dragonfly-vm
        uses: vmactions/dragonflybsd-vm@7cd7c9b7f2b06e8e03d2337a9476995f3c112acf # v1
        with:
          release: "6.4.2"
          mem: 6144
          cpu: 2
          sync: rsync
          custom-shell-name: dragonflybsd
      - name: Verify DragonFly VM shell helper after startup
        id: dragonfly-ready
        if: steps.start-dragonfly-vm.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dragonflybsd >/dev/null 2>&1; then
            echo "vmactions/dragonflybsd-vm did not install the dragonflybsd shell helper" >&2
            exit 1
          fi
      - name: Execute CLI and capture DragonFly evidence
        if: success() && steps.start-dragonfly-vm.outcome == 'success' && steps.dragonfly-ready.outcome == 'success'
        shell: dragonflybsd {0}
        run: |
          sh scripts/bsd-runtime-smoke.sh \
            bsd-ci/leaguebridge-dragonfly-amd64 \
            dragonfly \
            amd64 \
            DragonFly \
            bsd-evidence/dragonfly/amd64
      - name: Exercise shipped install lifecycle on DragonFly BSD 6.4.2
        if: always() && steps.start-dragonfly-vm.outcome == 'success' && steps.dragonfly-ready.outcome == 'success'
        shell: dragonflybsd {0}
        run: |
          mkdir -p bsd-evidence/dragonfly/amd64
          evidence_file=bsd-evidence/dragonfly/amd64/install-lifecycle.txt
          if ! sh scripts/verify-install.sh \
            dist/leaguebridge_0.0.0-ci_dragonfly_amd64.tar.gz \
            v0.0.0-ci \
            dragonfly \
            amd64 \
            >"$evidence_file" 2>&1; then
            cat "$evidence_file" >&2
            exit 1
          fi
      - name: Create score-free DragonFly runtime attestation subject
        if: success() && steps.start-dragonfly-vm.outcome == 'success' && steps.dragonfly-ready.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          export CI_ATTESTATION_TREE="$(git rev-parse HEAD^{tree})"
          go run -mod=vendor ./tools/nativeattestation \
            -kind bsd-runtime \
            -evidence-dir bsd-evidence/dragonfly/amd64 \
            -output bsd-evidence/dragonfly/amd64/native-runtime.json \
            -target-goos dragonfly \
            -target-goarch amd64 \
            -host-class virtualized \
            -subject bsd-ci/leaguebridge-dragonfly-amd64 \
            -command 'DragonFly BSD kernel runtime smoke; shipped archive install lifecycle'
      - name: Retain DragonFly runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bsd-runtime-dragonfly-6.4.2-amd64
          path: |
            bsd-evidence/dragonfly/
            bsd-ci/leaguebridge-dragonfly-amd64
          if-no-files-found: error
          retention-days: 30

  attest-bsd-runtime:
    name: Attest BSD runtime (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.event_name != 'pull_request'
    needs: [bsd-runtime, dragonfly-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: freebsd
            guest_version: "15.1"
            goarch: amd64
          - goos: freebsd
            guest_version: "15.1"
            goarch: arm64
          - goos: openbsd
            guest_version: "7.9"
            goarch: amd64
          - goos: openbsd
            guest_version: "7.9"
            goarch: arm64
          - goos: netbsd
            guest_version: "11.0"
            goarch: amd64
          - goos: netbsd
            guest_version: "11.0"
            goarch: arm64
          - goos: dragonfly
            guest_version: "6.4.2"
            goarch: amd64
    steps:
      - name: Download BSD runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bsd-runtime-${{ matrix.goos }}-${{ matrix.guest_version }}-${{ matrix.goarch }}
          path: bsd-runtime-input
      - name: Attest native BSD runtime subject and evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}/native-runtime.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}/kernel.txt
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}/version.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}/status.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}/readiness.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}/manifest-verify.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}/doctor.json
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}/result.txt
            bsd-runtime-input/bsd-evidence/${{ matrix.goos }}/${{ matrix.goarch }}/install-lifecycle.txt
            bsd-runtime-input/bsd-ci/leaguebridge-${{ matrix.goos }}-${{ matrix.goarch }}

  release-smoke:
    name: Reproducible release smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Build twice and compare release checksums
        env:
          VERSION: v0.0.0-ci
        run: bash scripts/verify-release-reproducible.sh
      - name: Retain archives for BSD lifecycle tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  linux-runtime:
    name: Hosted Linux runtime (${{ matrix.goarch }})
    needs: release-smoke
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Download validated release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-dist
          path: dist
      - name: Resolve verified repository-evidence marker
        id: repository-evidence
        shell: bash
        run: |
          set -euo pipefail
          go run -mod=vendor ./tools/readinesscheck -root .
          scorecard_sha256="$(sha256sum readiness/scorecard.json | awk '{print $1}')"
          if [[ ! "$scorecard_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "readiness scorecard did not produce a canonical SHA-256 digest" >&2
            exit 1
          fi
          printf 'value=leaguebridge-repository-evidence-v1:%s\n' "$scorecard_sha256" >> "$GITHUB_OUTPUT"
      - name: Exercise shipped Linux install lifecycle
        if: always()
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p linux-evidence/${{ matrix.goarch }}
          evidence_file=linux-evidence/${{ matrix.goarch }}/install-lifecycle.txt
          if ! {
            uname -a
            sh scripts/verify-install.sh \
              "dist/leaguebridge_0.0.0-ci_linux_${{ matrix.goarch }}.tar.gz" \
              v0.0.0-ci \
              linux \
              "${{ matrix.goarch }}"
          } >"$evidence_file" 2>&1; then
            cat "$evidence_file" >&2
            exit 1
          fi
      - name: Build and execute the native Linux CLI smoke
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.goarch }}
          REPOSITORY_EVIDENCE_VERIFICATION: ${{ steps.repository-evidence.outputs.value }}
        run: |
          mkdir -p ci-bin linux-evidence/${{ matrix.goarch }}
          go build -mod=vendor -trimpath -buildvcs=true \
            -ldflags "-X github.com/Yunushan/leaguebridge/internal/version.RepositoryEvidenceVerification=$REPOSITORY_EVIDENCE_VERIFICATION" \
            -o ci-bin/leaguebridge-linux-${{ matrix.goarch }} ./cmd/leaguebridge
          sh scripts/linux-runtime-smoke.sh ci-bin/leaguebridge-linux-${{ matrix.goarch }} linux-evidence/${{ matrix.goarch }}
      - name: Create score-free Linux runtime attestation subject
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          export CI_ATTESTATION_TREE="$(git rev-parse HEAD^{tree})"
          go run -mod=vendor ./tools/nativeattestation \
            -kind linux-runtime \
            -evidence-dir linux-evidence/${{ matrix.goarch }} \
            -output linux-evidence/${{ matrix.goarch }}/native-runtime.json \
            -target-goos linux \
            -target-goarch "${{ matrix.goarch }}" \
            -host-class hosted \
            -subject ci-bin/leaguebridge-linux-${{ matrix.goarch }} \
            -command 'hosted Linux runtime smoke; shipped archive install lifecycle'
      - name: Retain hosted Linux runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-runtime-${{ matrix.goarch }}
          path: |
            linux-evidence/
            ci-bin/leaguebridge-linux-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 30

  attest-linux-runtime:
    name: Attest hosted Linux runtime (${{ matrix.goarch }})
    if: github.event_name != 'pull_request'
    needs: linux-runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - name: Download Linux runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-runtime-${{ matrix.goarch }}
          path: linux-runtime-input
      - name: Attest native Linux runtime subject and evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            linux-runtime-input/linux-evidence/${{ matrix.goarch }}/native-runtime.json
            linux-runtime-input/linux-evidence/${{ matrix.goarch }}/kernel.txt
            linux-runtime-input/linux-evidence/${{ matrix.goarch }}/version.json
            linux-runtime-input/linux-evidence/${{ matrix.goarch }}/status.json
            linux-runtime-input/linux-evidence/${{ matrix.goarch }}/readiness.json
            linux-runtime-input/linux-evidence/${{ matrix.goarch }}/manifest-verify.json
            linux-runtime-input/linux-evidence/${{ matrix.goarch }}/doctor.json
            linux-runtime-input/linux-evidence/${{ matrix.goarch }}/result.txt
            linux-runtime-input/linux-evidence/${{ matrix.goarch }}/install-lifecycle.txt
            linux-runtime-input/ci-bin/leaguebridge-linux-${{ matrix.goarch }}

  verify-native-runtime-attestations:
    name: Verify signed native runtime attestations
    if: github.event_name != 'pull_request'
    needs: [attest-linux-runtime, attest-bsd-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Download Linux runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: linux-runtime-*
          path: native-runtime-input/linux
          merge-multiple: false
      - name: Download BSD runtime evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bsd-runtime-*
          path: native-runtime-input/bsd
          merge-multiple: false
      - name: Arrange exact native runtime set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p linux-evidence ci-bin bsd-evidence bsd-ci
          for arch in amd64 arm64; do
            source_root="native-runtime-input/linux/linux-runtime-$arch"
            destination="linux-evidence/$arch"
            mkdir -p "$destination"
            for file in native-runtime.json kernel.txt version.json status.json readiness.json manifest-verify.json doctor.json result.txt install-lifecycle.txt; do
              cp "$source_root/linux-evidence/$arch/$file" "$destination/$file"
            done
            cp "$source_root/ci-bin/leaguebridge-linux-$arch" "ci-bin/leaguebridge-linux-$arch"
          done
          for target in freebsd openbsd netbsd dragonfly; do
            case "$target" in
              freebsd) version=15.1; arches="amd64 arm64" ;;
              openbsd) version=7.9; arches="amd64 arm64" ;;
              netbsd) version=11.0; arches="amd64 arm64" ;;
              dragonfly) version=6.4.2; arches="amd64" ;;
            esac
            for arch in $arches; do
              source_root="native-runtime-input/bsd/bsd-runtime-${target}-${version}-${arch}"
              destination="bsd-evidence/$target/$arch"
              mkdir -p "$destination"
              for file in native-runtime.json kernel.txt version.json status.json readiness.json manifest-verify.json doctor.json result.txt install-lifecycle.txt; do
                cp "$source_root/bsd-evidence/$target/$arch/$file" "$destination/$file"
              done
              cp "$source_root/bsd-ci/leaguebridge-${target}-${arch}" "bsd-ci/leaguebridge-${target}-${arch}"
            done
          done
      - name: Verify signed native runtime attestations
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse HEAD^{tree})"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          common_args=(
            -expected-repository "$GITHUB_REPOSITORY"
            -expected-workflow .github/workflows/ci.yml
            -expected-commit "$actual_commit"
            -expected-tree "$actual_tree"
            -expected-ref "$GITHUB_REF"
            -expected-workflow-sha "$EXPECTED_WORKFLOW_SHA"
            -run-id "$EXPECTED_RUN_ID"
            -run-attempt "$EXPECTED_RUN_ATTEMPT"
          )
          go run -mod=vendor ./tools/nativeattestation \
            -verify -kind linux-runtime -expected-host-class hosted "${common_args[@]}" \
            -verify-subject linux-evidence/amd64/native-runtime.json \
            -verify-subject linux-evidence/arm64/native-runtime.json
          go run -mod=vendor ./tools/nativeattestation \
            -verify -kind bsd-runtime -expected-host-class virtualized "${common_args[@]}" \
            -verify-subject bsd-evidence/freebsd/amd64/native-runtime.json \
            -verify-subject bsd-evidence/freebsd/arm64/native-runtime.json \
            -verify-subject bsd-evidence/openbsd/amd64/native-runtime.json \
            -verify-subject bsd-evidence/openbsd/arm64/native-runtime.json \
            -verify-subject bsd-evidence/netbsd/amd64/native-runtime.json \
            -verify-subject bsd-evidence/netbsd/arm64/native-runtime.json \
            -verify-subject bsd-evidence/dragonfly/amd64/native-runtime.json
  native-package-linux:
    name: Native packages (Linux)
    if: github.event_name != 'pull_request'
    needs: release-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install the pinned runner package toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rpm
      - name: Download validated release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-dist
          path: dist
      - name: Build and smoke native Linux packages
        run: |
          set -euo pipefail
          bash scripts/native-package-linux-smoke.sh \
            v0.0.0-ci \
            dist/leaguebridge_0.0.0-ci_linux_amd64.tar.gz
      - name: Create signed native Linux package subjects
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "checked-out commit $actual_commit does not match GITHUB_SHA $GITHUB_SHA" >&2
            exit 1
          fi
          export CI_ATTESTATION_TREE="$(git rev-parse HEAD^{tree})"
          go run -mod=vendor ./tools/nativepackageattestation \
            -target-goos linux -target-goarch amd64 -family debian -format deb \
            -package native-package-output/debian/leaguebridge_0.0.0~ci_amd64.deb \
            -staging-dir native-package-staging/debian \
            -install-evidence native-package-evidence/debian/install.txt \
            -output native-package-evidence/debian/native-package.json \
            -command 'dpkg native package build; package-manager install and uninstall; native install smoke'
          go run -mod=vendor ./tools/nativepackageattestation \
            -target-goos linux -target-goarch amd64 -family rpm -format rpm \
            -package native-package-output/rpm/leaguebridge-0.0.0-1.ci.x86_64.rpm \
            -staging-dir native-package-staging/rpm \
            -install-evidence native-package-evidence/rpm/install.txt \
            -output native-package-evidence/rpm/native-package.json \
            -command 'rpm native package build; package-manager install and uninstall; native install smoke'
      - name: Attest native Linux package subjects
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            native-package-evidence/debian/native-package.json
            native-package-output/debian/leaguebridge_0.0.0~ci_amd64.deb
            native-package-staging/debian/NATIVE-PACKAGE-MANIFEST.json
            native-package-staging/debian/root/usr/bin/leaguebridge
            native-package-staging/debian/root/usr/libexec/leaguebridge/linux-bsd-client-smoke.sh
            native-package-staging/debian/root/usr/libexec/leaguebridge/linux-bsd-remote-session.sh
            native-package-staging/debian/root/usr/share/doc/leaguebridge/LICENSE
            native-package-staging/debian/root/usr/share/doc/leaguebridge/PACKAGE-MANIFEST.json
            native-package-staging/debian/root/usr/share/doc/leaguebridge/README.md
            native-package-staging/debian/root/usr/share/doc/leaguebridge/SBOM.spdx.json
            native-package-evidence/debian/install.txt
            native-package-evidence/rpm/native-package.json
            native-package-output/rpm/leaguebridge-0.0.0-1.ci.x86_64.rpm
            native-package-staging/rpm/NATIVE-PACKAGE-MANIFEST.json
            native-package-staging/rpm/root/usr/bin/leaguebridge
            native-package-staging/rpm/root/usr/libexec/leaguebridge/linux-bsd-client-smoke.sh
            native-package-staging/rpm/root/usr/libexec/leaguebridge/linux-bsd-remote-session.sh
            native-package-staging/rpm/root/usr/share/doc/leaguebridge/LICENSE
            native-package-staging/rpm/root/usr/share/doc/leaguebridge/PACKAGE-MANIFEST.json
            native-package-staging/rpm/root/usr/share/doc/leaguebridge/README.md
            native-package-staging/rpm/root/usr/share/doc/leaguebridge/SBOM.spdx.json
            native-package-evidence/rpm/install.txt
      - name: Retain native Linux package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-package-linux
          path: |
            native-package-output/
            native-package-staging/
            native-package-evidence/
          if-no-files-found: error
          retention-days: 30

  native-package-bsd:
